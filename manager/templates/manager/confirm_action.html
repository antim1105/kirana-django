{% extends "manager/base.html" %}

{% block content %}
<div class="mx-auto max-w-lg">
  <div class="card">
    <div class="card-body">
      <h1 class="text-lg font-semibold text-ink-950">{{ heading }}</h1>
      <p class="mt-2 text-sm text-slate-600">{{ message }}</p>

      <form method="post" action="{{ action_url }}" class="mt-6 flex flex-wrap items-center justify-end gap-2">
        {% csrf_token %}
        <a href="{{ cancel_url }}" class="btn btn-secondary">Cancel</a>
        <button type="submit" class="btn {% if tone == 'danger' %}btn-danger{% else %}btn-primary{% endif %}">
          {{ confirm_label }}
        </button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
